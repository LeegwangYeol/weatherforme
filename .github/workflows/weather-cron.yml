# 10분마다 배포된 앱의 강수 감시 엔드포인트를 호출한다.
# (Vercel 무료 플랜 크론은 하루 1회 제한이라 GitHub Actions를 주력으로 사용)
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   APP_URL     : 보조 배포 주소 (예: https://weatherforme-kohl.vercel.app)
#   CRON_SECRET : .env 의 CRON_SECRET 과 동일한 값
name: weather-cron

on:
  schedule:
    # 기상청 초단기예보는 매시 45분에 1회 갱신되므로 매시 50분(1시간 주기)에 호출하여
    # 기존 5분 주기(월 8,640회) 대비 호출 횟수와 Vercel CPU 사용량을 91.7%(월 720회) 절감
    - cron: "50 * * * *"
  workflow_dispatch: {}

jobs:
  check-rain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call rain-watch endpoint (prefer canonical weatherforme.vercel.app)
        run: |
          TARGET_URL="https://weatherforme.vercel.app"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 8 "$TARGET_URL" || echo "000")
          if [ "$STATUS" != "200" ] && [ -n "${{ secrets.APP_URL }}" ]; then
            TARGET_URL="${{ secrets.APP_URL }}"
          fi
          echo "Using target: $TARGET_URL (canonical HTTP=$STATUS)"
          curl -fsS -m 45 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$TARGET_URL/api/cron/weather"
